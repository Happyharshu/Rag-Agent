services:
  - type: web
    name: rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false          # enter this in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: TAVILY_API_KEY
        sync: false          # enter this in Render dashboard
      - key: PYTHONPATH
        value: /app          # ensures all modules resolve correctly
    healthCheckPath: /health
    autoDeploy: true
