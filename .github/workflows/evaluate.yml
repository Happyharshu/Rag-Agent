name: RAG Smoke Test CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports and module structure
        run: |
          python -c "
          from app.agent import build_graph, ask
          from app.api import app
          from vectorstore.store import build_index, hybrid_search
          from embeddings.embedder import embed_texts, embed_query, rerank
          from ingestion.ingest import load_pdfs
          print('✅ All modules import successfully')
          "

      - name: Verify FastAPI app starts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python -c "
          from app.api import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          resp = client.get('/health')
          assert resp.status_code == 200, f'Health check failed: {resp.text}'
          print('✅ /health endpoint OK:', resp.json())
          "

      - name: Check render.yaml exists
        run: |
          test -f render.yaml && echo "✅ render.yaml present" || (echo "❌ render.yaml missing" && exit 1)
