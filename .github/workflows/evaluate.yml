name: RAG Smoke Test CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values so module-level LLM/API clients don't crash on import
      # Real keys are only needed when actually making API calls
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_dummy_key_for_ci_import_check' }}
      GROQ_MODEL: llama-3.1-8b-instant
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'tvly_dummy_key_for_ci_import_check' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify module structure (imports only)
        run: |
          python -c "
          # Verify all modules are importable and structurally correct
          # Note: LLM clients are instantiated at module level in agent.py
          # so we need a dummy key set (done via env vars above)
          import vectorstore.store as vs
          import embeddings.embedder as emb
          import ingestion.ingest as ing
          print('✅ vectorstore.store   - OK')
          print('✅ embeddings.embedder - OK')
          print('✅ ingestion.ingest    - OK')
          "

      - name: Verify FastAPI app health endpoint
        run: |
          python -c "
          from app.api import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          resp = client.get('/health')
          assert resp.status_code == 200, f'Health check failed: {resp.text}'
          data = resp.json()
          assert data.get('status') == 'ok', f'Unexpected response: {data}'
          print('✅ /health endpoint OK:', data)
          "

      - name: Verify render.yaml and Dockerfile exist
        run: |
          test -f render.yaml      && echo "✅ render.yaml present"
          test -f Dockerfile       && echo "✅ Dockerfile present"
          test -f streamlit_app.py && echo "✅ streamlit_app.py present"
          test -f requirements.txt && echo "✅ requirements.txt present"
